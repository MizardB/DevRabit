[platformio]
default_envs = rcdev

[env:rcdev]
; Local checkout. For an independent project use the versioned HTTPS URL in README.
platform = file://../..
board = esp32doit-devkit-v1
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
board_build.esp-idf.sdkconfig_path = .pio/build/rcdev/sdkconfig
